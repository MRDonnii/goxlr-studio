<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Musik</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #e6ebf5; user-select: none; }
  .card { position: absolute; inset: 6px; display: flex; gap: 12px; padding: 10px; border-radius: 16px; box-sizing: border-box;
    background: rgba(13, 18, 30, .94); border: 1px solid rgba(34, 211, 238, .35); box-shadow: 0 10px 30px rgba(0,0,0,.5);
    opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .18s, transform .18s; }
  .card.show { opacity: 1; transform: none; }
  .cover { width: 104px; height: 104px; flex: none; border-radius: 10px; object-fit: cover; background: linear-gradient(135deg, rgba(34,211,238,.35), rgba(168,85,247,.35)); display: grid; place-items: center; font-size: 40px; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .top { display: flex; align-items: flex-start; gap: 6px; }
  .names { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: #9aa6bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { all: unset; cursor: pointer; color: #9aa6bd; width: 20px; height: 20px; text-align: center; border-radius: 6px; line-height: 20px; }
  .x:hover { background: rgba(255,255,255,.08); color: #e6ebf5; }
  .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 2px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #a855f7); }
  .times { display: flex; justify-content: space-between; color: #9aa6bd; font-size: 11px; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 4px; margin-top: auto; }
  .b { all: unset; cursor: pointer; width: 30px; height: 28px; display: grid; place-items: center; border-radius: 8px; font-size: 15px; }
  .b:hover { background: rgba(255,255,255,.1); }
  .b.play { background: rgba(34,211,238,.18); }
  .vol { flex: 1; display: flex; align-items: center; gap: 6px; margin-left: 8px; min-width: 0; }
  .vol input { flex: 1; min-width: 0; accent-color: #22d3ee; }
  .vol span { width: 34px; text-align: right; color: #9aa6bd; font-size: 11px; font-variant-numeric: tabular-nums; }
  .vol.off { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="cover" id="cover">♪</div>
  <div class="main">
    <div class="top">
      <div class="names"><div class="title" id="title">…</div><div class="sub" id="sub"></div></div>
      <button class="x" id="close" title="Luk">✕</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="times"><span id="pos"></span><span id="len"></span></div>
    <div class="ctl">
      <button class="b" data-cmd="previous" title="Forrige">⏮</button>
      <button class="b play" data-cmd="play-pause" id="play" title="Afspil/pause">⏯</button>
      <button class="b" data-cmd="next" title="Næste">⏭</button>
      <label class="vol off" id="vol" title="Musik-kanalen på GoXLR’en"><span>🔊</span><input type="range" min="0" max="100" id="volume"><span id="volpct"></span></label>
    </div>
  </div>
</div>
<script type="module" src="js/music.js"></script>
</body>
</html>

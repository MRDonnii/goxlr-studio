<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>OSD</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 600 17px/1.2 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #e6ebf5; }
  .box { position: absolute; inset: 6px; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-radius: 16px;
    background: rgba(13, 18, 30, .92); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 10px 30px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(-8px) scale(.98); transition: opacity .15s, transform .15s; }
  .box.show { opacity: 1; transform: none; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #22d3ee, #a855f7); box-shadow: 0 0 12px rgba(34,211,238,.7); }
  .box.mute { border-color: rgba(244, 63, 94, .6); }
  .box.mute .dot { background: #f43f5e; box-shadow: 0 0 12px rgba(244,63,94,.8); }
  .box.ok .dot { background: #34d399; box-shadow: 0 0 12px rgba(52,211,153,.7); }
  .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="box" id="box"><span class="dot"></span><span class="text" id="text"></span></div>
<script src="js/osd.js"></script>
</body>
</html>

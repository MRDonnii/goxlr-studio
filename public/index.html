<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoXLR Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">

      <div class="sidebar-foot">
        <div id="conn" class="conn"><span class="dot"></span><span class="label">Forbinder…</span></div>
        <div id="device" class="device"></div>

    </aside>
    <main>

        <h1 id="title"></h1>
        <div class="top-actions" id="top-actions"></div>

      <div id="banners" class="banners"></div>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

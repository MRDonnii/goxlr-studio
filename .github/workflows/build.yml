name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src-tauri/target/release/goxlr-studio.exe "dist/GoXLR-Studio-portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist/

      - uses: actions/upload-artifact@v4
        with:
          name: GoXLR-Studio-windows
          path: dist/*

      # A new version in tauri.conf.json on main publishes a release (tag v<version>) automatically;
      # pushing a v* tag still works too. The app's auto-update picks the release up.
      - name: Decide release
        id: rel
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          $isTag = "${{ github.ref }}".StartsWith('refs/tags/v')
          $isMain = "${{ github.ref }}" -eq 'refs/heads/main' -and "${{ github.event_name }}" -ne 'pull_request'
          $publish = $isTag -or ($isMain -and -not $exists)
          if ($isTag) { $tag = "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GoXLR Studio ${{ steps.rel.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in public/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Unit tests
        run: node --test tests/*.test.mjs

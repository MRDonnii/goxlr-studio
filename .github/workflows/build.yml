name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The GoXLR engine (GoXLR Utility's daemon, MIT) is compiled into the app from
      # src-tauri/goxlr-engine; its sibling crates come from GoXLR Utility's v1.2.4 tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Built-in EQ engine: Equalizer APO's engine files (GPL), taken unchanged from the official
      # installer, verified by SHA-256. The matching source code is attached to every release.
      - name: Fetch EQ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force engine-dl, engine | Out-Null
          function Get-Verified($url, $out, $sha) {
            for ($i = 1; $i -le 4; $i++) {
              curl.exe -sSL --retry 3 -o $out $url
              if ((Test-Path $out) -and ((Get-FileHash $out -Algorithm SHA256).Hash -eq $sha)) { return }
              Start-Sleep -Seconds (10 * $i)
            }
            throw "Download failed or checksum mismatch: $url"
          }
          Get-Verified 'https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-x64-1.4.2.exe/download' 'engine-dl/apo.exe' '7403BE7427BBE1936A40DDED082829B6E217FC4F5990FEE5CBA501F0AE055AFA'
          Get-Verified 'https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-src-1.4.2.zip/download' 'engine-dl/EqualizerAPO-src-1.4.2.zip' 'BACD5C78BE71F3AAAB010684AB39F0E5C1BBB45FCD75CBB92C103A145A731DC4'
          7z x -y -oengine-dl/x engine-dl/apo.exe | Out-Null
          foreach ($f in 'EqualizerAPO.dll','fftw3f.dll','sndfile.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "engine-dl/x/$f" engine/
          }
          # Støjfjerning af chatten: RNNoise VST-plugin (werman/noise-suppression-for-voice v1.22, GPL-3.0).
          Get-Verified 'https://github.com/werman/noise-suppression-for-voice/releases/download/v1.22/win-rnnoise.zip' 'engine-dl/win-rnnoise.zip' '7FC1A031438C27CB5731BDD4B627CC890387752C26436FD7E7B29A9C67CC708E'
          7z x -y -oengine-dl/rnnoise engine-dl/win-rnnoise.zip | Out-Null
          Copy-Item 'engine-dl/rnnoise/win-rnnoise/vst/rnnoise_stereo.dll' engine/
          if ((Get-FileHash engine/rnnoise_stereo.dll -Algorithm SHA256).Hash -ne '925350973E6A2036CF74FDA4B43E8A87B415A864DAD94AF943105BC1D5EE7E36') { throw 'rnnoise_stereo.dll checksum mismatch' }
          # Its source code for the release (the exact tagged commit).
          git clone -q --depth 1 --branch v1.22 https://github.com/werman/noise-suppression-for-voice engine-dl/rnnoise-src
          if ((git -C engine-dl/rnnoise-src rev-parse HEAD) -ne '0b8c03b368ca609247a0cb65b0c8eb651759dd69') { throw 'noise-suppression-for-voice v1.22 is not the expected commit' }
          git -C engine-dl/rnnoise-src archive --format=zip --prefix=noise-suppression-for-voice-1.22/ -o ../noise-suppression-for-voice-src-1.22.zip HEAD
          "ENGINE_DIR=$((Resolve-Path engine).Path)" >> $env:GITHUB_ENV
          "ENGINE_VERSION=1.4.2" >> $env:GITHUB_ENV

      # Dynamik: GoXLR Studio's own limiter/compressor VST plugin (plugins/dynamics), tested and built
      # here and embedded next to the EQ engine like the noise-suppression plugin.
      - name: Build Dynamik plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # From its own folder, so its .cargo/config.toml (static C runtime) applies.
          Push-Location plugins/dynamics
          cargo test
          if ($LASTEXITCODE -ne 0) { throw 'Dynamik tests failed' }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'Dynamik build failed' }
          Pop-Location
          Copy-Item plugins/dynamics/target/release/goxlr_studio_dynamics.dll $env:ENGINE_DIR

      # Ren mikrofon: echo cancellation + noise suppression on the GoXLR's Chat Mic (plugins/voiceclean).
      # Its tests run in release (they include a speed test for the audio engine).
      - name: Build Ren mikrofon plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location plugins/voiceclean
          cargo test --release
          if ($LASTEXITCODE -ne 0) { throw 'Ren mikrofon tests failed' }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'Ren mikrofon build failed' }
          Pop-Location
          Copy-Item plugins/voiceclean/target/release/goxlr_studio_voice.dll $env:ENGINE_DIR

      # Signed updates: with the repository secret UPDATE_SIGNING_KEY (base64 of 32 random bytes,
      # an ed25519 private key) the matching public key is built into the app, and latest.json is
      # signed below. Without the secret everything works as before (unsigned).
      - name: Update signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:KEY) { Write-Host 'No UPDATE_SIGNING_KEY – updates are not signed'; exit 0 }
          python -m pip install --quiet cryptography==43.0.3
          $pub = python -c "import base64,os;from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K;from cryptography.hazmat.primitives import serialization as s;k=K.from_private_bytes(base64.b64decode(os.environ['KEY'].strip()));print(base64.b64encode(k.public_key().public_bytes(s.Encoding.Raw,s.PublicFormat.Raw)).decode())"
          if ($LASTEXITCODE -ne 0 -or -not $pub) { throw 'UPDATE_SIGNING_KEY is not a valid key (base64 of 32 bytes)' }
          Write-Host "Update public key: $pub"
          "UPDATE_PUBKEY=$pub" >> $env:GITHUB_ENV

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src-tauri/target/release/goxlr-studio.exe "dist/GoXLR-Studio-portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item THIRD-PARTY-NOTICES.md dist/
          Copy-Item engine-dl/EqualizerAPO-src-1.4.2.zip dist/
          Copy-Item engine-dl/noise-suppression-for-voice-src-1.22.zip dist/
          # Stream Deck-plugin: the folder zipped with the folder itself at the root, as Stream Deck wants it.
          Compress-Archive -Path streamdeck/com.goxlrstudio.sdPlugin -DestinationPath dist/GoXLR-Studio-plugin.zip
          Move-Item dist/GoXLR-Studio-plugin.zip dist/GoXLR-Studio.streamDeckPlugin
          # The same plugin for Streonor / MiraBox StreamDock: its own manifest (the app can also install it itself).
          New-Item -ItemType Directory sd-pack | Out-Null
          Copy-Item -Recurse streamdeck/com.goxlrstudio.sdPlugin sd-pack/
          Move-Item -Force sd-pack/com.goxlrstudio.sdPlugin/manifest.streamdock.json sd-pack/com.goxlrstudio.sdPlugin/manifest.json
          Compress-Archive -Path sd-pack/com.goxlrstudio.sdPlugin -DestinationPath dist/GoXLR-Studio-StreamDock.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GoXLR-Studio-windows
          path: dist/*

      # A new version in tauri.conf.json on main publishes a release (tag v<version>) automatically;
      # pushing a v* tag still works too. The app's auto-update picks the release up.
      - name: Decide release
        id: rel
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          $isTag = "${{ github.ref }}".StartsWith('refs/tags/v')
          $isMain = "${{ github.ref }}" -eq 'refs/heads/main' -and "${{ github.event_name }}" -ne 'pull_request'
          $publish = $isTag -or ($isMain -and -not $exists)
          if ($isTag) { $tag = "${{ github.ref_name }}" }
          # Danish release notes for this version, if written (docs/releases/<version>.md).
          $notes = "docs/releases/$($tag.TrimStart('v')).md"
          if (-not (Test-Path $notes)) { $notes = '' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # latest.json: what the app's update check reads from releases/latest/download/ – an ordinary
      # file download, so it is not limited to GitHub API's 60 requests an hour per connection.
      # Same shape as GitHub's API (tag_name, body, html_url, assets with SHA-256 digests).
      - name: Write latest.json
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = '${{ steps.rel.outputs.tag }}'
          $repo = '${{ github.repository }}'
          # GitHub turns spaces in uploaded file names into dots; name the files that way up front.
          Get-ChildItem dist -File | Where-Object { $_.Name -match ' ' } | ForEach-Object { Rename-Item $_.FullName ($_.Name -replace ' ', '.') }
          $assets = @(Get-ChildItem dist -File | ForEach-Object {
            [ordered]@{
              name = $_.Name
              browser_download_url = "https://github.com/$repo/releases/download/$tag/$($_.Name)"
              digest = 'sha256:' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              size = $_.Length
            }
          })
          $notes = '${{ steps.rel.outputs.notes }}'
          $body = if ($notes) { Get-Content -Raw -Encoding utf8 $notes } else { '' }
          [ordered]@{
            tag_name = $tag
            name = "GoXLR Studio $tag"
            html_url = "https://github.com/$repo/releases/tag/$tag"
            body = $body
            assets = $assets
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
          Get-Content dist/latest.json

      - name: Sign latest.json
        if: steps.rel.outputs.publish == 'true' && env.UPDATE_PUBKEY != ''
        shell: pwsh
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python -c "import base64,os;from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K;k=K.from_private_bytes(base64.b64decode(os.environ['KEY'].strip()));d=open('dist/latest.json','rb').read();open('dist/latest.json.sig','w').write(base64.b64encode(k.sign(d)).decode())"
          if ($LASTEXITCODE -ne 0) { throw 'Signing latest.json failed' }
          Get-Content dist/latest.json.sig

      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GoXLR Studio ${{ steps.rel.outputs.tag }}
          body_path: ${{ steps.rel.outputs.notes }}
          files: dist/*
          generate_release_notes: true

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Unit tests (engine registration logic, migration, API)
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in public/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Unit tests
        run: node --test tests/*.test.mjs

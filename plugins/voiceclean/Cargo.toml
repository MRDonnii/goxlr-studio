[package]
name = "goxlr-studio-voice"
version = "1.0.0"
edition = "2021"
description = "GoXLR Studio's clean microphone: echo cancellation (WebRTC AEC3) and noise suppression (WebRTC NS + RNNoise) as a VST2 plugin for the EQ engine on the mic"
license = "MIT"
publish = false

[lib]
name = "goxlr_studio_voice"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure Rust ports, BSD-3-Clause: WebRTC's audio processing (AEC3, noise suppression, high-pass)
# and Xiph's RNNoise.
sonora = "0.2"
nnnoiseless = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
codegen-units = 1

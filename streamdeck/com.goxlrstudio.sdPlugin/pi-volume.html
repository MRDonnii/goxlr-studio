<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="pi.css"></head>
<body data-kind="volume">
<div class="status" id="status">…</div>
<div class="row"><label id="l-channel">Kanal</label><select id="channel"></select></div>
<div class="row"><label id="l-name">Navn</label><input id="name" type="text" maxlength="12"></div>
<div class="row"><label id="l-step">Trin (%)</label><input id="step" type="number" min="1" max="50"></div>
<div class="row"><label id="l-direction">Tryk på tast</label><select id="direction"><option value="up"></option><option value="down"></option></select></div>
<details id="conn"><summary id="l-conn">Forbindelse til GoXLR Studio</summary>
  <div class="row"><label id="l-token">Token</label><input id="token" type="password" autocomplete="off"></div>
  <div class="row"><label id="l-port">Port</label><input id="port" type="number" min="1" max="65535"></div>
  <div class="hint" id="h-conn"></div>
</details>
<script src="common.js"></script>
<script src="pi.js"></script>
</body>
</html>
